name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bridge
    env:
      # RUSTFLAGS replaces rustflags from .cargo/config.toml, so +crt-static is repeated here.
      RUSTFLAGS: -C target-feature=+crt-static -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: bridge
      - name: Build (warning = error)
        run: cargo build --locked
      - name: Test
        run: cargo test --locked --lib
