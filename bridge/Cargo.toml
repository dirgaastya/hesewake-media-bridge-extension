[package]
name = "hesewake-media-bridge"
version = "0.1.0"
edition = "2021"
description = "Hesewake Media Bridge: media from an Android phone in Hesewake Notch, as an extension"
license = "MIT"
publish = false

[dependencies]
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
mdns-sd = "0.11"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rqrr = "0.7"

[workspace]
