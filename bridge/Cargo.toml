[package]
name = "hesewake-media-bridge"
version = "0.1.0"
edition = "2021"
description = "Hesewake Media Bridge: media from an Android phone in Hesewake Notch, as an extension"
license = "MIT"
publish = false

[dependencies]
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
mdns-sd = "0.11"

[workspace]
